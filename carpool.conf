server {
    server_name boljao.com www.boljao.com;

    location /static/ {
        alias /opt/carpool-mono-repo/carpool-api/staticfiles/;
        autoindex off;
    }

    location /media/ {
        alias /opt/carpool-mono-repo/carpool-api/mediafiles/;
    }

    # Go location microservice — must appear before the generic /api/ block
    location /api/v1/locations/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
    }

    location /api/ {
        proxy_pass http://unix:/run/gunicorn-carpool/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Flower (Celery monitoring) — Flower runs with --url_prefix=flower so its
    # internal links resolve under this path. Guard with FLOWER_BASIC_AUTH.
    location /flower/ {
        proxy_pass http://127.0.0.1:5555;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /tutorials/ {
        alias /opt/tutorials/;
        autoindex on;
    }

    client_max_body_size 500M;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/boljao.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/boljao.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.boljao.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = boljao.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name boljao.com www.boljao.com;
    return 404; # managed by Certbot




}
# Jenkins (podman container bound to 127.0.0.1:8080).
# Start as plain HTTP, then run `sudo certbot --nginx -d jenkins.boljao.com`;
# Certbot adds the 443/ssl listener and the HTTP->HTTPS redirect to this block.
server {
    listen 80;
    server_name jenkins.boljao.com;

    client_max_body_size 100M;  # plugin uploads

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Jenkins streams console output and uses websockets
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 90s;
    }
}
